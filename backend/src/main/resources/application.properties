# ===========================================
# Server Configuration
# ===========================================
server.port=${SERVER_PORT:8080}

# ===========================================
# PostgreSQL Database Configuration
# ===========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# HikariCP Connection Pool Configuration
# ===========================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=TaskAppHikariPool

# ===========================================
# SQL Initialization
# ===========================================
spring.sql.init.mode=${SQL_INIT_MODE:always}

# ===========================================
# Logging Configuration
# ===========================================
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.example.demo=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.jdbc=${LOG_LEVEL_JDBC:WARN}
logging.level.com.zaxxer.hikari=${LOG_LEVEL_HIKARI:INFO}

# ===========================================
# Actuator Configuration
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ===========================================
# Application Info
# ===========================================
info.app.name=Task Management API
info.app.version=1.0.0
info.app.description=Task Management REST API with Spring Boot
